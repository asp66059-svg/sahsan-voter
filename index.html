    .ward-btn { flex-shrink: 0; padding: 7px 15px; font-size: 13px; font-weight: 600; border: 1px solid #cbd5e1; border-radius: 20px; background: white; color: #334155; cursor: pointer; }

    .meta-bar { font-size: 13px; font-weight: 600; color: #475569; margin-bottom: 10px; padding: 0 4px; }
    .voter-card { background: white; border-radius: 10px; padding: 12px 14px; margin-bottom: 9px; border-left: 5px solid #2563eb; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
    .card-head { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #f1f5f9; padding-bottom: 6px; margin-bottom: 6px; }
    .voter-name { font-size: 16px; font-weight: 700; color: #1e3a8a; }
    .tag { font-size: 11px; background: #dbeafe; color: #1e40af; padding: 2px 8px; border-radius: 12px; font-weight: 600; }
    .card-detail { font-size: 13.5px; margin: 3px 0; color: #334155; }

    function changeWard(ward, el) {
      activeWard = ward;
      document.querySelectorAll('.ward-btn').forEach(b => b.classList.remove('active'));
      el.classList.add('active');
      handleSearch();
    }

    function handleSearch() {
      const q = document.getElementById('voterSearch').value.trim().toLowerCase();
      const filtered = rawVoters.filter(item => {
        const matchWard = activeWard === 'all' || String(item.ward_no) === String(activeWard);
        if (!matchWard) return false;
        if (!q) return true;

        const name = String(item.name || '').toLowerCase();
        const rel = String(item.relative_name || '').toLowerCase();
        const epic = String(item.epic_no || '').toLowerCase();
        const sNo = String(item.serial_no || '');
        const hNo = String(item.house_no || '');

        return name.includes(q) || rel.includes(q) || epic.includes(q) || sNo === q || hNo === q;
      });

      render(filtered);
    }

    function render(list) {
      const container = document.getElementById('cardContainer');
      const stat = document.getElementById('statText');
      container.innerHTML = '';
      stat.innerText = "दिख रहे मतदाता: " + list.length;

      if (list.length === 0) {
        container.innerHTML = '<p style="text-align:center;color:#94a3b8;padding:40px 10px;">कोई मतदाता रिकॉर्ड नहीं मिला</p>';
        return;
      }

      list.forEach(v => {
        const div = document.createElement('div');
        div.className = 'voter-card';
        div.innerHTML = `
          <div class="card-head">
            <span class="voter-name">${v.name}</span>
            <span class="tag">वार्ड ${v.ward_no} • क्र. ${v.serial_no}</span>
          </div>
          <div class="card-detail"><span class="highlight">संबंधी का नाम:</span> ${v.relative_name}</div>
          <div class="card-detail"><span class="highlight">मकान नं:</span> ${v.house_no} | <span class="highlight">उम्र:</span> ${v.age} | <span class="highlight">लिंग:</span> ${v.gender === 'M' ? 'पुरुष' : 'स्त्री'}</div>
          <div class="card-detail"><span class="highlight">EPIC पहचान पत्र:</span> ${v.epic_no || 'उपलब्ध नहीं'}</div>
        `;
        container.appendChild(div);
      });
    }
