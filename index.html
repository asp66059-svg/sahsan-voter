<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ग्राम पंचायत सहसन - मतदाता खोज पोर्टल</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { margin: 0; padding: 10px; background: #eef2f6; color: #1f2937; }
    .header { background: linear-gradient(135deg, #1e40af, #3b82f6); color: white; padding: 14px 12px; border-radius: 12px; text-align: center; margin-bottom: 12px; }
    .header h1 { margin: 0; font-size: 19px; }
    .header p { margin: 4px 0 0; font-size: 13px; opacity: 0.92; }
    .ward-slider { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 10px; scrollbar-width: none; }
    .ward-slider::-webkit-scrollbar { display: none; }
    .ward-btn { flex-shrink: 0; padding: 7px 15px; font-size: 13px; font-weight: 600; border: 1px solid #cbd5e1; border-radius: 20px; background: white; color: #334155; cursor: pointer; }
    .ward-btn.active { background: #1e40af; color: white; border-color: #1e40af; }
    .search-input { width: 100%; padding: 12px 14px; font-size: 16px; border: 2px solid #3b82f6; border-radius: 10px; outline: none; background: white; margin-bottom: 10px; }
    .meta-bar { font-size: 13px; font-weight: 600; color: #475569; margin-bottom: 10px; padding: 0 4px; }
    .voter-card { background: white; border-radius: 10px; padding: 12px 14px; margin-bottom: 9px; border-left: 5px solid #2563eb; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
    .card-head { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #f1f5f9; padding-bottom: 6px; margin-bottom: 6px; }
    .voter-name { font-size: 16px; font-weight: 700; color: #1e3a8a; }
    .tag { font-size: 11px; background: #dbeafe; color: #1e40af; padding: 2px 8px; border-radius: 12px; font-weight: 600; }
    .card-detail { font-size: 13.5px; margin: 3px 0; color: #334155; }
    .highlight { color: #0f172a; font-weight: 600; }
  </style>
</head>
<body>

  <div class="header">
    <h1>ग्राम पंचायत सहसन</h1>
    <p>मतदाता खोज व वोटर पर्ची पोर्टल 2026</p>
  </div>

  <div class="ward-slider">
    <button class="ward-btn active" onclick="changeWard('all', this)">सभी वार्ड (1-19)</button>
    <button class="ward-btn" onclick="changeWard(1, this)">वार्ड 1</button>
    <button class="ward-btn" onclick="changeWard(2, this)">वार्ड 2</button>
    <button class="ward-btn" onclick="changeWard(3, this)">वार्ड 3</button>
    <button class="ward-btn" onclick="changeWard(4, this)">वार्ड 4</button>
    <button class="ward-btn" onclick="changeWard(5, this)">वार्ड 5</button>
    <button class="ward-btn" onclick="changeWard(6, this)">वार्ड 6</button>
    <button class="ward-btn" onclick="changeWard(7, this)">वार्ड 7</button>
    <button class="ward-btn" onclick="changeWard(8, this)">वार्ड 8</button>
    <button class="ward-btn" onclick="changeWard(9, this)">वार्ड 9</button>
    <button class="ward-btn" onclick="changeWard(10, this)">वार्ड 10</button>
    <button class="ward-btn" onclick="changeWard(11, this)">वार्ड 11</button>
    <button class="ward-btn" onclick="changeWard(12, this)">वार्ड 12</button>
    <button class="ward-btn" onclick="changeWard(13, this)">वार्ड 13</button>
    <button class="ward-btn" onclick="changeWard(14, this)">वार्ड 14</button>
    <button class="ward-btn" onclick="changeWard(15, this)">वार्ड 15</button>
    <button class="ward-btn" onclick="changeWard(16, this)">वार्ड 16</button>
    <button class="ward-btn" onclick="changeWard(17, this)">वार्ड 17</button>
    <button class="ward-btn" onclick="changeWard(18, this)">वार्ड 18</button>
    <button class="ward-btn" onclick="changeWard(19, this)">वार्ड 19</button>
  </div>

  <input type="text" id="voterSearch" class="search-input" placeholder="नाम, पिता/पति का नाम, EPIC या मकान नं. खोजें..." oninput="handleSearch()">

  <div class="meta-bar">
    <span id="statText">कुल मतदाता लोड हो रहे हैं...</span>
  </div>

  <div id="cardContainer"></div>

  <script>
    const rawVoters = [
[1, 1, "RJ/09/068/144137", "लल्लु", "रहमत", "1", 86, "M"],
[2, 1, "LTW1211838", "अफजल", "लल्लु", "1", 60, "M"],
[3, 1, "RJ/09/068/144436", "शहीनमोहम्मद", "लल्लु", "1", 48, "M"],
[4, 1, "LTW1211846", "फईमन", "शहीनमोहम्मद", "1", 46, "F"],
[5, 1, "LTW1046028", "इकबाल मोहम्मद", "लल्लू", "1", 44, "M"],
[6, 1, "TOG0147991", "पम्मी", "इकबाल मोहम्मद", "1", 42, "F"],
[7, 1, "TOG0201806", "साबिर", "लल्लू", "1", 39, "M"],
[8, 1, "TOG0903930", "इमरान", "लल्लू", "1", 33, "M"],
[9, 1, "TOG0903948", "मुकीमन", "इमरान", "1", 30, "F"],
[10, 1, "TOG1868017", "अरफीना", "साबिर", "01", 30, "F"],
[11, 1, "TOG2138246", "मुस्कान", "साबिर", "1", 20, "F"],
[12, 1, "TOG2140887", "साहिल", "अफजल", "1", 20, "M"],
[13, 1, "RJ/09/068/144136", "रहमत", "जुम्मा", "2", 84, "M"],
[14, 1, "RJ/09/068/144361", "हमीदी", "रहमत", "2", 82, "F"],
[15, 1, "RJ/09/068/144362", "रहीश", "रहमत", "2", 52, "M"],
[16, 1, "RJ/09/068/144363", "कश्मीरी", "रहीश", "2", 50, "F"],
[17, 1, "LTW1211853", "शौकत", "रहमत", "2", 48, "M"],
[18, 1, "LTW1211861", "खुर्शीदन", "शौकत", "2", 44, "F"],
[19, 1, "TOG0587121", "अनीस", "रहीश", "2", 31, "M"],
[20, 1, "TOG0587139", "इरशाद", "रहीश", "2", 30, "M"],
[21, 1, "TOG0746651", "मुनफेद", "रहीश", "2", 28, "M"],
[22, 1, "TOG1469592", "साहिबा", "अनीस", "2", 27, "F"],
[23, 1, "TOG1917243", "अरशद", "शौकत", "2", 21, "M"],
[24, 1, "TOG2085736", "नाजिम", "शौकत", "2", 19, "M"],
[25, 1, "TOG2154375", "जुनैद", "रहीश", "2", 19, "M"]
    

    let activeWard = 'all';

    function changeWard(ward, el) {
      activeWard = ward;
      document.querySelectorAll('.ward-btn').forEach(b => b.classList.remove('active'));
      el.classList.add('active');
      handleSearch();
    }

    function handleSearch() {
      const q = document.getElementById('voterSearch').value.trim().toLowerCase();
      const filtered = rawVoters.filter(item => {
        const matchWard = activeWard === 'all' || String(item.ward_no) === String(activeWard);
        if (!matchWard) return false;
        if (!q) return true;

        const name = String(item.name || '').toLowerCase();
        const rel = String(item.relative_name || '').toLowerCase();
        const epic = String(item.epic_no || '').toLowerCase();
        const sNo = String(item.serial_no || '');
        const hNo = String(item.house_no || '');

        return name.includes(q) || rel.includes(q) || epic.includes(q) || sNo === q || hNo === q;
      });

      render(filtered);
    }

    function render(list) {
      const container = document.getElementById('cardContainer');
      const stat = document.getElementById('statText');
      container.innerHTML = '';
      stat.innerText = "दिख रहे मतदाता: " + list.length;

      if (list.length === 0) {
        container.innerHTML = '<p style="text-align:center;color:#94a3b8;padding:40px 10px;">कोई मतदाता रिकॉर्ड नहीं मिला</p>';
        return;
      }

      list.forEach(v => {
        const div = document.createElement('div');
        div.className = 'voter-card';
        div.innerHTML = `
          <div class="card-head">
            <span class="voter-name">${v.name}</span>
            <span class="tag">वार्ड ${v.ward_no} • क्र. ${v.serial_no}</span>
          </div>
          <div class="card-detail"><span class="highlight">संबंधी का नाम:</span> ${v.relative_name}</div>
          <div class="card-detail"><span class="highlight">मकान नं:</span> ${v.house_no} | <span class="highlight">उम्र:</span> ${v.age} | <span class="highlight">लिंग:</span> ${v.gender === 'M' ? 'पुरुष' : 'स्त्री'}</div>
          <div class="card-detail"><span class="highlight">EPIC पहचान पत्र:</span> ${v.epic_no || 'उपलब्ध नहीं'}</div>
        `;
        container.appendChild(div);
      });
    }

    handleSearch();
  </script>
</body>
</html>
