[246, 1, "TOG2138410", "सलमान खां", "मजीद अहमद", "24", 19, "M"],
[247, 1, "RJ/09/068/144207", "रहमान खां", "रहमत", "25", 73, "M"],
[248, 1, "RJ/09/068/144208", "हमीदन बी", "रहमान खां", "25", 70, "F"],
[249, 1, "RJ/09/068/144410", "मुबारक अली", "रहमान खां", "25", 47, "M"],
[250, 1, "RJ/09/068/144411", "समीना खातून", "मुबारक अली", "25", 44, "F"]
      
 ];

    var rawVoters = voterData.map(function(v) {
      if (Array.isArray(v)) {
        return {
          serial_no: v[0],
          ward_no: v[1],
          epic_no: v[2] || "",
          name: v[3] || "",
          relative_name: v[4] || "",
          house_no: v[5] || "",
          age: v[6] || "",
          gender: v[7] || ""
        };
      }
      return v;
    });

    var selectedWard = "all";

    var slider = document.getElementById("wardSlider");
    var searchBox = document.getElementById("voterSearch");

    slider.addEventListener("click", function(e) {
      if (e.target.classList.contains("ward-btn")) {
        var allButtons = slider.querySelectorAll(".ward-btn");
        for (var i = 0; i < allButtons.length; i++) {
          allButtons[i].classList.remove("active");
        }
        e.target.classList.add("active");
        selectedWard = e.target.getAttribute("data-ward");
        updateList();
      }
    });

    searchBox.addEventListener("input", function() {
      updateList();
    });

    function updateList() {
      var query = searchBox.value.trim().toLowerCase();
      var results = [];

      for (var i = 0; i < rawVoters.length; i++) {
        var v = rawVoters[i];
        var wardMatch = (selectedWard === "all") || (String(v.ward_no) === String(selectedWard));
        if (!wardMatch) continue;

        if (!query) {
          results.push(v);
          continue;
        }

        var n = String(v.name).toLowerCase();
        var r = String(v.relative_name).toLowerCase();
        var e = String(v.epic_no).toLowerCase();
        var h = String(v.house_no).toLowerCase();
        var s = String(v.serial_no);

        if (n.indexOf(query) !== -1 || r.indexOf(query) !== -1 || e.indexOf(query) !== -1 || h === query || s === query) {
          results.push(v);
        }
      }

      displayCards(results);
    }

    function displayCards(list) {
      var container = document.getElementById("cardContainer");
      var stat = document.getElementById("statText");

      stat.innerText = "दिख रहे मतदाता: " + list.length;
      container.innerHTML = "";

      if (list.length === 0) {
        container.innerHTML = "<p style='text-align:center;color:#64748b;padding:30px 10px;font-weight:600;'>कोई मतदाता रिकॉर्ड नहीं मिला</p>";
        return;
      }

      var limit = Math.min(list.length, 150);
      var cardsHtml = "";

      for (var i = 0; i < limit; i++) {
        var item = list[i];
        var gText = item.gender === "M" ? "पुरुष" : (item.gender === "F" ? "स्त्री" : item.gender);

        cardsHtml += "<div class='voter-card'>" +
          "<div class='card-head'>" +
            "<span class='voter-name'>" + item.name + "</span>" +
            "<span class='tag'>वार्ड " + item.ward_no + " • क्र. " + item.serial_no + "</span>" +
          "</div>" +
          "<div class='card-detail'><span class='highlight'>संबंधी का नाम:</span> " + item.relative_name + "</div>" +
          "<div class='card-detail'><span class='highlight'>मकान नं:</span> " + item.house_no + " | <span class='highlight'>उम्र:</span> " + item.age + " वर्ष | <span class='highlight'>लिंग:</span> " + gText + "</div>" +
          "<div class='card-detail'><span class='highlight'>EPIC पहचान पत्र:</span> " + (item.epic_no || "उपलब्ध नहीं") + "</div>" +
        "</div>";
      }

      container.innerHTML = cardsHtml;
    }

    updateList();
  </script>
</body>
</html>
